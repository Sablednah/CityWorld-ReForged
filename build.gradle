plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The jar carries the Minecraft version it was built against. All supported versions share a mod
// version, so three files called cityworld-5.1.0.jar would be indistinguishable in a mods folder or
// on a releases page. The mod's own version (in neoforge.mods.toml) stays a plain ${mod_version}.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // JourneyMap's API (compile-only; see the dependencies block). BlameJared is the maven TeamJM
    // asks addons to use — their own jm.gserv.me mirror goes down often.
    maven {
        name = 'BlameJared (JourneyMap API)'
        url = 'https://maven.blamejared.com'
    }
    // JourneyMap itself, for dev runs only. The mod JarJars the API and common-networking, so this
    // one artifact is the whole runtime dependency.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // SignBlockEntity's only public way to set text insists on notifying its level, which is a
    // deadlock during worldgen — see SupportBlocks.setSignText. We write the field instead.
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    version = project.neo_version

    // Parchment gives human-readable parameter names/javadocs. Optional.
    // Enabled only when both properties are set in gradle.properties (some MC
    // versions may not have Parchment mappings published yet).
    if (project.parchment_minecraft_version?.trim() && project.parchment_mappings_version?.trim()) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }

    // Access Transformers are auto-detected from META-INF/accesstransformer.cfg

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Join a server straight from the launcher:  ./gradlew runClient -PcwJoin=127.0.0.1
            // The split case (a real client against a real dedicated server) is the only way to
            // exercise the payload channel, waypoints crossing the wire, and overlays pushed to a
            // client in another JVM — none of which single-player can break. Note that passing
            // --args here does not work: ModDevGradle's run task treats it as the main class.
            if (project.hasProperty('cwJoin')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('cwJoin').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Headless worldgen verification: generates a CityWorld world, checks the generator is
        // installed, sweeps the planner, reads a built chunk back, and halts. Used by
        // scripts/selftest.sh to compare every supported Minecraft version. See CityWorldSelfTest.
        selfTest {
            server()
            programArgument '--nogui'
            systemProperty 'cityworld.selftest', 'true'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' declares runtime-only test dependencies that are NOT published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JourneyMap integration is a SOFT dependency: compile-only, and nothing outside
    // me.daddychurchill.CityWorld.integration.journeymap may reference a journeymap.* type, so the
    // classes are never loaded when JourneyMap is absent. JourneyMap finds our plugin itself by
    // scanning for @JourneyMapPlugin. See PORTING.md.
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
}

// Expand mod metadata properties into the generated neoforge.mods.toml.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_homepage           : mod_homepage,
            journeymap_version_range: journeymap_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
