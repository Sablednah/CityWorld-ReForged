# CityWorld access transformers.
#
# SignBlockEntity.frontText — CityWorld writes street names, statue plaques and fossil labels during
# chunk decoration, where the block entity has no level and must not be given one. Every public way
# in (updateText/setText -> setFrontText) ends at markUpdated(), which notifies the level: that both
# NPEs when the level is null and DEADLOCKS when it isn't, because setChanged() re-enters the chunk
# system (Level.blockEntityChanged -> getChunkAt -> join) from a generation worker thread.
#
# Neither notification is wanted here: there are no clients to update during worldgen, and the block
# entity is already stored in the chunk (WorldGenRegion.getBlockEntity calls setBlockEntity), so it
# saves without being marked. Writing the field is the whole operation.
public net.minecraft.world.level.block.entity.SignBlockEntity frontText
# backText — same story, for signs we want readable from both sides (e.g. the named mine-entrance
# headframes). setText(text, false) -> setBackText -> markUpdated() has the identical NPE/deadlock.
public net.minecraft.world.level.block.entity.SignBlockEntity backText
# ItemFrame.setRotation(int, boolean) — the public setRotation(int) always passes true, and that calls
# Level.updateNeighbourForOutputSignal on the REAL level from a generation worker: hasChunkAt, then
# getBlockState -> getChunk -> a join on the server thread, which is itself waiting for that chunk. A
# museum podium's frame (Support/Exhibits) hung world creation at "Preparing spawn area" this way — but
# only where the chunk already held a FULL ticket when it decorated (spawn area, a teleport, a forced
# chunk); a chunk that decorates as its neighbour's ring answers hasChunkAt false, which is why no sweep,
# probe or self-test saw it. No comparator needs telling about a frame that is still being generated.
public net.minecraft.world.entity.decoration.ItemFrame setRotation(IZ)V
# ConfirmScreen.callback — CityWorld answers vanilla's "experimental settings" confirm on the player's behalf
# when the only thing making the new world experimental is CityWorld's own dimensions (see
# client/ExperimentalWarningSkip). The screen is cancelled before it opens, so its callback is the only
# handle on "proceed".
public net.minecraft.client.gui.screens.ConfirmScreen callback
# WorldGenRegion's chunk cache, centre and step — worldgen/ShiftedRegion is a second region over the same chunks
# that raises every position by a city's own level (a vanilla-terrain world, where each city stands at the
# height of the land it was put on while CityWorld draws at one street level). The constructor takes all three
# and the class offers no getter for any of them.
public net.minecraft.server.level.WorldGenRegion cache
public net.minecraft.server.level.WorldGenRegion center
public net.minecraft.server.level.WorldGenRegion generatingStep
