# CityWorld — mods.toml (values are expanded from gradle.properties at build time).
# 1.20.1 Forge reads META-INF/mods.toml, not neoforge.mods.toml, and its dependency blocks take
# mandatory=true/false where NeoForge takes type="required"/"optional".
# ⚠ I first wrote type= here, on the grounds that the string "mandatory" appears nowhere in the
# constant pools of fmlloader/fmlcore while "type" appears eight times. That reasoning was worthless:
# FML rejected the file outright with "Missing required field mandatory in dependency". Counting
# string constants is not evidence about a schema — run it and read the error.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
# Bugs come here, not to the original author: this is a fork and upstream cannot fix it.
issueTrackerURL="https://github.com/Sablednah/CityWorld-ReForged/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="${mod_homepage}"
# Three keys, because the mod list changed shape in 26.2:
#   iconFile   — the small square beside the name in the list (26.2+ only; without it the row is
#                the only one in the list with no icon at all).
#   bannerFile — the wide image in the info panel (26.2+), rendered at its own aspect ratio.
#   logoFile   — what 1.21.x and 26.1 show in the info panel, and what 26.2 falls back to if
#                bannerFile is missing. Kept so older versions still show artwork.
# Older loaders simply ignore the two keys they don't know.
# 1.20.1's mod list shows logoFile only; iconFile/bannerFile are 26.2+ and would just be ignored.
logoFile="cityworld.png"
logoBlur=false
iconBlur=false

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: when JourneyMap is present, CityWorld marks landmarks and draws the city plan on its map
# (see me.daddychurchill.CityWorld.integration.journeymap). The API is compileOnly and no journeymap
# class is referenced outside that package, so this is a true soft dependency — the entry only pins
# the API generation we build against and asks the loader to start JourneyMap first. The range is a
# gradle property because JourneyMap's version strings lead with the Minecraft version, so each
# version branch needs its own floor.
[[dependencies.${mod_id}]]
    modId="journeymap"
    mandatory=false
    versionRange="${journeymap_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional, and load-ORDER is the entire point: CityWorld ships an override of BoP's own
# data/biomesoplenty/worldgen/placed_feature/large_rose_quartz.json, and a mod's datapack only wins a
# file conflict if it is sorted after the mod it overrides. Without this entry the override is a silent
# no-op — measured 2026-09-16: 6 rose quartz blocks across a 13x13-chunk sweep either way, identical to
# stock BoP, because BoP's pack loaded last. (The override aims BoP's placement at the ruined Nether's
# cave band; BoP tunes it for vanilla's 128-block Nether and ours is ~3x taller. See PORTING.md.)
[[dependencies.${mod_id}]]
    modId="biomesoplenty"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
