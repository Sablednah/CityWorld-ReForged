# CityWorld — neoforge.mods.toml (values are expanded from gradle.properties at build time).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
# Bugs come here, not to the original author: this is a fork and upstream cannot fix it.
issueTrackerURL="https://github.com/Sablednah/CityWorld-ReForged/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="${mod_homepage}"
# Three keys, because the mod list changed shape in 26.2:
#   iconFile   — the small square beside the name in the list (26.2+ only; without it the row is
#                the only one in the list with no icon at all).
#   bannerFile — the wide image in the info panel (26.2+), rendered at its own aspect ratio.
#   logoFile   — what 1.21.x and 26.1 show in the info panel, and what 26.2 falls back to if
#                bannerFile is missing. Kept so older versions still show artwork.
# Older loaders simply ignore the two keys they don't know.
iconFile="cityworld.png"
bannerFile="cityworld-banner.png"
logoFile="cityworld.png"
logoBlur=false
iconBlur=false

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
