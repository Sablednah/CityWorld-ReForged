# Generated at build time -- do not edit. See build.gradle's build stamp block.
# Namespaced under /cityworld/ so it cannot collide with another mod's copy on
# the classpath, which a bare /build.properties would.
#
# version carries the Minecraft target as well as the mod version, because
# CityWorld ships three jars per release -- one per Minecraft line, from three
# branches -- and "5.7.0" alone does not say which of them ran.
commit=${build_commit}
branch=${build_branch}
time=${build_time}
version=${mod_version}+mc${minecraft_version}
