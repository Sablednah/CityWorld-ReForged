# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.2)
# The Neo version must agree with the Minecraft version to get a valid artifact.
neo_version=26.1.2.95
# Any NeoForge for THIS Minecraft line. Bounded above on purpose — an open-ended range claims
# compatibility with NeoForge for Minecraft versions this jar cannot run on.
neo_version_range=[26.1,26.2)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=cityworld
mod_name=CityWorld
mod_license=GPL-3.0-only
mod_version=5.2.0
# Shown as the mod's home page in the in-game mod list. The issue tracker is set separately in
# the neoforge.mods.toml template and points at this fork's GitHub, never upstream's.
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/cityworld-reforged
mod_group_id=me.daddychurchill.cityworld
mod_authors=DaddyChurchill, Sablednah
mod_description=Procedurally generates endless cities, roads, buildings, mines, sewers, farms and nature. A modern NeoForge rewrite of the classic CityWorld Bukkit plugin.
